# Hyperparameters for GPT-2 Core training

# Data Parameters
max_length: 512
batch_size: 8

# Training Parameters
learning_rate: 0.00001  # 1e-5
num_epochs: 15
gradient_accumulation_steps: 4
weight_decay: 0.01
early_stopping_patience: 5
lr_scheduler_patience: 2
lr_scheduler_factor: 0.5

# Model Paths (relative to src/ directory)
output_dir: "results/core_results"
best_model_path: "results/core_results/gpt2_best_model"
final_model_path: "results/core_results/gpt2_final"
plot_path: "results/core_results/training_curves.png"

# Data Paths (relative to src/ directory)
robot_control_path: "dataset/Surgical_Robotics/robot_control.json"

# Evaluation Parameters
eval_sample_size: 100
generation_max_length: 150
generation_temperature: 0.7
generation_top_p: 0.9
num_test_prompts: 3

# Robot Control Split
robot_train_split: 0.7  # 70% train, 30% validation
